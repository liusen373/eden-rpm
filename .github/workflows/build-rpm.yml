name: Build RPM in Fedora Container

on:
  create:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  determine-image:
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.detect.outputs.branch_name }}
      container_image: ${{ steps.detect.outputs.container_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Detect branch and choose container image
        id: detect
        run: |
          REF_NAME="${{ github.ref_name }}"
          REF_TYPE="${{ github.ref_type }}"
          
          # 提取分支名
          if [ "$REF_TYPE" = "branch" ]; then
            branch_name="$REF_NAME"
          elif [ "$REF_TYPE" = "tag" ]; then
          # 从标签中提取分支名（最后一个-后的部分）
            branch_name="${REF_NAME##*-}"
          else
            echo "Error: Unknown ref_type: $REF_TYPE"
            exit 1
          fi

          # 根据分支名确定容器镜像
          if [ "$branch_name" = "rawhide" ]; then
            container_image="fedora:rawhide"
          elif [[ "$branch_name" =~ ^f[0-9]+$ ]]; then
            # 提取数字部分
            version="${branch_name#f}"
            container_image="fedora:$version"
          else
            echo "Error: Unrecognized branch name format: $branch_name"
            exit 1
          fi

          # 输出结果（可以在后续步骤中使用）
          echo "branch_name=$branch_name" >> $GITHUB_OUTPUT
          echo "container_image=$container_image" >> $GITHUB_OUTPUT
          echo "container_image=$container_image" >> $GITHUB_ENV
          
          echo "Branch name: $branch_name"
          echo "Container image: $container_image"

  build-rpm:
    needs: determine-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.determine-image.outputs.container_image }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        dnf group install -y rpm-development-tools c-development development-tools
        dnf builddep -y *.spec

    - name: Setup rpmbuild
      run: |
        rpmdev-setuptree
        # 复制spec文件
        cp *.spec ~/rpmbuild/SPECS/
        
        # 复制源代码文件
        # 根据你的实际需求调整
        cp -r sources/* ~/rpmbuild/SOURCES/ 2>/dev/null || true

    - name: Extract version info
      id: version_info
      run: |
        # 判断触发事件是标签还是分支
        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          # 如果是标签触发，直接提取标签名
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version==" >> $GITHUB_OUTPUT
          echo "branch=" >> $GITHUB_OUTPUT # 标签触发时，分支可为空
          echo "release=" >> $GITHUB_OUTPUT # 标签触发时，可忽略 spec 中的 Release
        else
          # 如果是分支触发，从 spec 文件提取并组合tag
          VERSION=$(grep '^Version:' *.spec | awk '{print $2}')
          RELEASE=$(grep '^Release:' *.spec | awk '{print $2}' | sed 's/%{?dist}//')
          BRANCH=${GITHUB_REF#refs/heads/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "release=${RELEASE}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "tag=${VERSION}-${BRANCH}" >> $GITHUB_OUTPUT
        fi

    - name: Cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/ccache
          /root/.cache/ccache
        key: ${{ steps.version_info.outputs.tag }}

    - name: Build RPM
      run: |
        cd ~/rpmbuild/SPECS/
        # 下载源码（如果spec中有Source URL）
        spectool -g -R *.spec

        # 启用ccache
        export PATH="/usr/lib64/ccache:$PATH"

        # 构建RPM
        rpmbuild -ba *.spec
        
        # 列出生成的RPM
        find ~/rpmbuild/RPMS ~/rpmbuild/SRPMS -name "*.rpm"
    
    - name: Prepare For Release
      run: mv ~/rpmbuild .

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version_info.outputs.tag }}
        name: ${{ steps.version_info.outputs.tag }}
        files: |
          ./rpmbuild/RPMS/**/*.rpm
          ./rpmbuild/SRPMS/*.rpm
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}